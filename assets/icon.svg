<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E2C"/>
      <stop offset="1" stop-color="#13151E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>

  <g stroke="#7A99FF" stroke-width="74" stroke-linecap="round" filter="url(#glow)" opacity="0.95">
    <line x1="296" y1="408" x2="744" y2="408"/>
    <line x1="280" y1="616" x2="728" y2="616"/>
    <line x1="436" y1="280" x2="380" y2="744"/>
    <line x1="644" y1="280" x2="588" y2="744"/>
  </g>
</svg>
